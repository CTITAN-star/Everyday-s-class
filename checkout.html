<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Everyday's Class</title><link rel="stylesheet" href="css.css"></head><body><header class="nav glass"><a class="brand serif" href="index.html">Everyday's Class</a><a class="icon-btn" href="cart.html">←</a></header><main class="container"><section class="page-head"><span class="eyebrow">Your details</span><h1 class="serif">Checkout</h1><p>Tell us where to reach you. We will use your email for pickup or delivery updates.</p></section><form id="checkout-form" class="form-card glass"><div class="form-grid"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone" type="tel" required></div><div class="field"><label>Fulfilment</label><select name="fulfilment"><option value="pickup">Pickup</option><option value="delivery">Delivery to my address</option></select></div><div class="field full"><label>Delivery address</label><textarea name="address" placeholder="Required for delivery. You can enter Pickup if collecting from Yidi Gate."></textarea></div></div><div class="notice" style="margin:20px 0">A ₦100 service / processing charge applies to every order. Delivery adds ₦1,500.</div><button class="pill pill-primary" style="width:100%">Continue to Payment</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
